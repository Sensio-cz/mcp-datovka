[project]
name = "mcp-datovka"
version = "0.1.0"
description = "MCP server for Czech ISDS (datove schranky) - read, send, and manage data messages across multiple data boxes"
requires-python = ">=3.11"
# Licence se uvadi JEN takhle (PEP 639). Klasifikator
# "License :: OSI Approved :: MIT License" tu byl navic a soucasny setuptools
# kvuli nemu odmita balik sestavit ("License classifiers have been superseded
# by license expressions") - zmereno 23. 9. 2026, instalace skoncila chybou.
license = "MIT"
authors = [{name = "Sensio.cz", email = "info@sensio.cz"}]
readme = "README.md"
keywords = ["mcp", "isds", "datovka", "datova-schranka", "czech", "model-context-protocol", "datove-schranky"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Intended Audience :: Developers",
]
dependencies = [
    # HORNI MEZ JE NUTNA: v mcp 2.x zmizel `mcp.server.fastmcp` (FastMCP se
    # prejmenoval na MCPServer), takze server.py se s nim ani nenaimportuje.
    # Bez meze stahne pip nejnovejsi verzi a server na cisté instalaci vubec
    # nenastartuje - zmereno 23. 9. 2026 na cistem stroji.
    "mcp[cli]>=1.0.0,<2",
    "zeep>=4.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/Sensio-cz/mcp-datovka"
Repository = "https://github.com/Sensio-cz/mcp-datovka"
Issues = "https://github.com/Sensio-cz/mcp-datovka/issues"
Changelog = "https://github.com/Sensio-cz/mcp-datovka/blob/master/CHANGELOG.md"

[project.scripts]
mcp-datovka = "mcp_datovka.__main__:main"

[build-system]
# SETUPTOOLS 77 JE MINIMUM, ne opatrnost: `license = "MIT"` jako SPDX vyraz
# (PEP 639) umi az od te verze. S 75.8.2 i 76.1.0 build konci hlaskou
# "invalid pyproject.toml config: 'project.license'", ktera vypada jako chyba
# v souboru, ne jako stara verze nastroje - zmereno nezavislym reviewem
# 23. 9. 2026. S beznou build isolation to pip zakryje, protoze si stahne
# nejnovejsi; projevi se to pri --no-build-isolation a na offline strojich.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_datovka*"]

[tool.setuptools.package-data]
mcp_datovka = ["wsdl/*.wsdl", "wsdl/*.xsd"]
